<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jobsuche</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app">
      <section class="chat" aria-label="Chat">
        <header class="chat-head">
          <h1>Jobsuche</h1>
          <p class="progress">In Progress</p>
        </header>
        <div id="messages" class="messages"></div>
        <form id="composer" class="composer">
          <label class="sr-only" for="input">Nachricht</label>
          <textarea id="input" rows="3" placeholder="Frontend mit React in Berlin, Homeoffice, ab 70.000 Euro, kein PHP"></textarea>
          <div id="attachment" class="attachment" hidden>
            <span id="attachment-name"></span>
            <button id="attachment-remove" class="icon-button" type="button" aria-label="Datei entfernen">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="composer-row">
            <div class="composer-tools">
              <label class="icon-button" for="file">
                <input id="file" type="file" accept=".pdf,.txt,.md,.png,.jpg,.jpeg,.webp,.tif,.tiff,text/plain,text/markdown,application/pdf,image/*">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.82-2.83l8.48-8.48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="sr-only">Datei</span>
              </label>
              <button id="voice" class="icon-button" type="button" aria-pressed="false" aria-label="Sprache">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                  <path d="M12 3a3 3 0 00-3 3v6a3 3 0 006 0V6a3 3 0 00-3-3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                  <path d="M19 11a7 7 0 01-14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
            <button id="send" type="submit">Senden</button>
          </div>
          <p id="hint" class="hint"></p>
        </form>
      </section>
      <section class="results" aria-label="Stellen">
        <div class="results-scroll">
          <div id="empty" class="empty-state">
            <p class="empty-kicker">Zum Beispiel:</p>
            <p id="prompt" class="empty-line"></p>
          </div>
          <div id="board" hidden>
            <header class="results-head">
              <h2>Passende Jobs</h2>
              <p id="summary"></p>
              <div id="chips" class="chips"></div>
            </header>
            <div id="matches" class="cards"></div>
            <details id="rejected" class="rejected" hidden>
              <summary>Aussortiert</summary>
              <div id="unknown" class="cards rejected-cards"></div>
            </details>
          </div>
        </div>
        <div id="dock" class="dock" hidden>
          <div class="dock-pane">
            <p id="tokens" class="tokens"></p>
            <pre id="debug" class="debug"></pre>
          </div>
          <pre id="log" class="log" aria-label="Protokoll"></pre>
        </div>
      </section>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
